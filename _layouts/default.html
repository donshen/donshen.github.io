<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.dek | default: site.description | strip_html | truncate: 180 }}">
<link rel="stylesheet" href="/assets/css/site.css">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="/feed.xml">
{% if page.external %}<link rel="canonical" href="{{ page.external }}">{% endif %}
</head>
<body{% if page.hero %} class="has-hero"{% endif %}>

<div class="navbar">
  <div class="wrap sitenav">
    <a class="brand" href="/">{{ site.title }}</a>
    <nav>
      <a href="/"{% if page.url == "/" %} aria-current="page"{% endif %}>Writing</a>
      <a href="/about/"{% if page.url == "/about/" %} aria-current="page"{% endif %}>About</a>
    </nav>
  </div>
</div>

{{ content }}

<div class="footbar">
  <div class="wrap sitefoot">
    <ul>
      <li><a href="https://scholar.google.com/citations?user=mX2LPRwAAAAJ&amp;hl=en">Google Scholar</a></li>
      <li><a href="https://www.linkedin.com/in/donshen16/">LinkedIn</a></li>
      <li><a href="/feed.xml">RSS</a></li>
    </ul>
    <p>&copy; {{ site.time | date: "%Y" }} {{ site.title }}</p>
  </div>
</div>

</body>
</html>
